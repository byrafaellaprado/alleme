    <article> 
        <div class="cadastro">
            <form action="#" method="post">

  <h2>Comprar Revista Física</h2>


  <label for="nome">Nome completo:</label><br>
  <input type="text" id="nome" name="nome" required placeholder="Seu nome"><br><br>

  <label for="social">Nome social:</label><br>
      <input type="text" id="social" name="social"> <br><br>

  <label for="cpf">CPF:</label><br>
  <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00"><br><br>

  <label for="email">E-mail:</label><br>
  <input type="email" id="email" name="email" required placeholder="voce@email.com"><br><br>

  <label for="telefone">Telefone:</label><br>
  <input type="tel" id="telefone" name="telefone" required placeholder="(00) 90000-0000"><br><br>



  <label for="rua">Rua:</label><br>
  <input type="text" id="rua" name="rua" required><br><br>

  <label for="numero">Número:</label><br>
  <input type="text" id="numero" name="numero" required><br><br>

  <label for="bairro">Bairro:</label><br>
  <input type="text" id="bairro" name="bairro" required><br><br>

  <label for="cidade">Cidade:</label><br>
  <input type="text" id="cidade" name="cidade" required><br><br>

  <label for="estado">Estado:</label><br>
  <input type="text" id="estado" name="estado" required><br><br>

  <label for="cep">CEP:</label><br>
  <input type="text" id="cep" name="cep" required placeholder="00000-000"><br><br>

  <label for="pais">País:</label><br>
  <input type="text" id="pais" name="pais" required><br><br>

 
  <label for="revista">Revista:</label><br>
  <select id="revista" name="revista" required>
    <option value="">Selecione a edição</option>
    <option value="2026-05">Maio 2026 (mais recente)</option>
    <option value="2026-04">Abril 2026</option>
    <option value="2026-03">Março 2026</option>
    <option value="2026-02">Fevereiro 2026</option>
    <option value="2026-01">Janeiro 2026</option>
    <option value="2025-12">Dezembro 2025</option>
    <option value="2025-11">Novembro 2025</option>
    <option value="2025-10">Outubro 2025</option>
  </select><br><br>

 
  <label for="quantidade">Quantidade:</label><br>
  <input type="number" id="quantidade" name="quantidade" required min="1" max="10" value="1"><br><br>



  <label for="envio">Forma de envio:</label><br>
  <select id="envio" name="envio" required>
    <option value="">Escolha uma opção</option>
    <option value="normal">Entrega normal (correios)</option>
    <option value="expresso">Entrega expressa</option>
    <option value="retirada">Retirar na redação</option>
  </select><br><br>


  <label for="pagamento">Método de pagamento:</label><br>
  <select id="pagamento" name="pagamento" required>
    <option value="">Selecione</option>
    <option value="cartao">Cartão de crédito</option>
    <option value="pix">PIX</option>
    <option value="boleto">Boleto bancário</option>
  </select><br><br>

  <label for="obs">Observações (opcional):</label><br>
  <textarea id="obs" name="obs" rows="4" cols="40" placeholder="Alguma observação sobre o pedido?"></textarea><br><br>

  <button type="submit">Finalizar Compra</button>

</form>
